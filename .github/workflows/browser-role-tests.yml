name: Browser role tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/browser-role-tests.yml"

permissions:
  contents: read

jobs:
  browser-role-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://olianski.github.io/celu-piezaz-dot-com/
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_SHOP_EMAIL: ${{ secrets.TEST_SHOP_EMAIL }}
      TEST_SHOP_PASSWORD: ${{ secrets.TEST_SHOP_PASSWORD }}
      TEST_TECHNICIAN_EMAIL: ${{ secrets.TEST_TECHNICIAN_EMAIL }}
      TEST_TECHNICIAN_PASSWORD: ${{ secrets.TEST_TECHNICIAN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Create tests
        run: |
          mkdir -p tests/browser artifacts
          cat > tests/browser/roles.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          const site = process.env.SITE_URL;
          const roles = [
            { name: 'admin', email: process.env.TEST_ADMIN_EMAIL, password: process.env.TEST_ADMIN_PASSWORD, expected: /administraci[oó]n|resumen|usuarios|tiendas/i },
            { name: 'shop', email: process.env.TEST_SHOP_EMAIL, password: process.env.TEST_SHOP_PASSWORD, expected: /inventario|pedidos|tienda/i },
            { name: 'technician', email: process.env.TEST_TECHNICIAN_EMAIL, password: process.env.TEST_TECHNICIAN_PASSWORD, expected: /cat[aá]logo|buscar|pedidos|modelo/i },
          ];

          test('public login screen loads', async ({ page }) => {
            const response = await page.goto(site, { waitUntil: 'domcontentloaded', timeout: 60000 });
            expect(response).not.toBeNull();
            expect(response.status()).toBeLessThan(400);
            await expect(page.locator('#authGate')).toBeVisible();
            await expect(page.locator('#authEmail')).toBeVisible();
            await expect(page.locator('#authPassword')).toBeVisible();
            await page.screenshot({ path: 'artifacts/login-screen.png', fullPage: true });
          });

          for (const role of roles) {
            test(`role login: ${role.name}`, async ({ page }) => {
              test.skip(!role.email || !role.password, `Configure TEST_${role.name.toUpperCase()}_EMAIL and PASSWORD repository secrets`);
              await page.goto(site, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.locator('#authEmail').fill(role.email);
              await page.locator('#authPassword').fill(role.password);
              await page.getByRole('button', { name: 'Entrar' }).click();
              await expect(page.locator('#authGate')).toBeHidden({ timeout: 30000 });
              await expect(page.locator('body')).toContainText(role.expected, { timeout: 20000 });
              await page.screenshot({ path: `artifacts/role-${role.name}.png`, fullPage: true });
            });
          }
          EOF
      - name: Run browser tests
        run: npx playwright test tests/browser/roles.spec.cjs --reporter=list
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
