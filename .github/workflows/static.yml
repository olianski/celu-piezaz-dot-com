name: Static tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run frontend checks
        run: node tests/static-v39.js app/index.html
      - name: Run backend checks
        run: node tests/backend-static.js supabase/migrations/001_initial_schema.sql supabase/migrations/002_order_transaction.sql supabase/migrations/003_auth_profile.sql supabase/migrations/004_roles_and_operations.sql supabase/migrations/004_tiendas_inventario.sql supabase/migrations/005_admin_only_account_creation.sql supabase/migrations/006_normalize_phone_model_names.sql supabase/migrations/006_prevent_duplicate_phone_models.sql supabase/migrations/007_audit_integrity_roles_catalog.sql supabase/migrations/008_protect_business_data_and_order_flow.sql supabase/migrations/009_revoke_internal_trigger_function_execution.sql supabase/migrations/010_restrict_authenticated_writes_and_inventory_guard.sql supabase/migrations/011_deduplicate_open_demand_requests.sql supabase/seed/002_catalog_master.sql
